<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            color: black;
            text-decoration: underline;

        }

        .google:hover{
            text-decoration: overline;
        }

        a:active{
            color: yellow;
        }

        button:active{
            color: blueviolet;
        }

        a::after{
            content: '[link]';
            color: antiquewhite;
            font-weight: normal;
        }

        .google::before{
            content: "[# ";
        }

        .google::after{
            content: " #]";
            color: red;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h1>personalizando Links</h1>

    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório GitHUB</a></li>
        <li><a href="https://youtube.com/cursoemvideo" target="_blank">Canal do Youtube</a></li>
        <li><a href="https://www.cursosemvideo.com" target="_blank">Site do CursoemVideo</a></li>

        <li> <a href="https://google.com" class="google">Pinto</a></li>
    </ul>

    

    <button>clica</button>
</body>
</html>
