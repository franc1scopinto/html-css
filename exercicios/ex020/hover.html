<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
        }
        div>p{
            display:none ;
        }

        div:hover>p{
            display: block;
            background-color: blue;
        }
        div:hover{
            background-color: rgb(0, 255, 94);
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto Abaixo</p>
    <div>
        Passe o mouse aqui
        <p>PAUUUUUUUUUUUU</p>
    </div>

    <p> Fimmmm do Exemplo</p>
</body>
</html>
