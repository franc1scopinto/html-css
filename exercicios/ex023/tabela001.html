<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Primeira Tabela</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        .linha{
            background-color: blue;
        }

        td{
            text-align: center;
            vertical-align: middle;
            border: 1px solid black;
        }

        .numero{
            text-align: right;
        }


        .dado{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Minha tabela</h1>
    <!--HIERARQUIA DE TABELA(SIMPLES)
        <table> TABLE=TABELA
           <tr> TABLE ROW=LINHA DA TABELA
                   <th> TABLE HEADER=CABEÇALHO DE TABELA
                    <td> TABLE DATA=DADO DE TABELA
    -->

    <table>
        <tr> <!--1º LINHA-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>

        <tr class="linha"><!--2º LINHA-->
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>

        </tr>

        <tr><!--3º LINHA-->
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>

        <tr><!--4º LINHA-->
            <td>A4</td>
            <td>B4</td>
            <td class="dado">C4</td>
        </tr>



    </table>
</body>
</html>
