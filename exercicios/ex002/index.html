<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e Quebras de linha</h1>
    <hr>
    <p>
        você pode escrvever
        parágrafos de qualquer
        jeito é do colocar
        dentro da tag &lt;p &gt; e  &lt;/p&gt; <!--lt/(less than )//gt/(greater than)-->

    </p>

    <p>se precisar quebrar
        o texto em algum lugar 
        específico <br> como esse, 
        voce pode usar a tag &lt;br&gt;
    </p>

    <p>Vamos adicionar alguns Simbolos especiais:

        &reg;
        &copy;
        &trade;

    </p>


    <p>Vamos adicionar Emojis:</p><!--VAI PRA EMOJI(emojipedia.org) site para obter o códio do emoji-->



    <!--Sintaxe para colocar emoji : &#xcódigo_do_emoji;-->
    &#x1F606;
    &#x1F64C;


</body>
</html>
