<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Teste de Formulário</h1>

    <form  method="POST" autocomplete="on">

        <p>
            <label for="i_usuario">Nome:</label>
            <input type="email" name="" id="i_usuario" required minlength="5" autocomplete="email">
        </p>

        <p>
            <label for="i_senha">Senha:</label>
            <input type="password" name="" id="i_senha" required maxlength="5" autocomplete="current-password">
        </p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Resetar">



    </form>
</body>
</html>
