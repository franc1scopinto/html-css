<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tnete abrir esse site em diferentes dispositivos ou simplesmente aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="images/p-pequeno.png" type="image/png">

        <source media="(max-width:1050px)" srcset="images/p-medio.png" type="image/png">

        <img src="images/p-grande.png" alt="imagem flexivel">
    </picture>

    <h2>Reproduzindo Aúdio</h2>

    <p>Vamos aprender a colocar aúdio no nosso site:</p>

    <audio src="midia/limitado.mp3" preload="metadata" controls ></audio>

    <audio>
        <source src="midia/limitado.mp3" type="audio/mpeg">
        <source src="midia/limitado.ogg" type="audio/ogg"> <!--No caso de ter uma arquivo OGG [no caso do navegador ñ vou compativel com o aúdio, faça dessa forma com o (source:src) dentro da tag <audio>] ele tenta carregar de cima pra baixa -->
    </audio>

    

</body>
</html>
